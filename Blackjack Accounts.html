<!doctype html>
<html lang="de" data-theme="dark" style="color-scheme: dark;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blackjack Accounts</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1a1f1c;--mu:#6b746e;--ac:#0f7a4a;--up:#0f7a4a;--dn:#c0392b;--bd:#e1e5df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101512;--card:#18201b;--tx:#e8ede9;--mu:#8e9a92;--ac:#3ecf8e;--up:#3ecf8e;--dn:#ff6b5b;--bd:#27322b}}
:root[data-theme="dark"]{--bg:#101512;--card:#18201b;--tx:#e8ede9;--mu:#8e9a92;--ac:#3ecf8e;--up:#3ecf8e;--dn:#ff6b5b;--bd:#27322b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--mu);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.tabs button{flex:1;min-width:84px}
button,select,input{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{cursor:pointer}button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{color:var(--mu);font-weight:600;font-size:13px}
.up{color:var(--up)}.dn{color:var(--dn)}.me{background:rgba(15,122,74,.12);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.row>*{flex:1;min-width:110px}
.mu{color:var(--mu);font-size:13px}code{word-break:break-all}
</style></head><body><main id="app"></main>
<script type="application/json" id="data">{"players":[{"id":"p1792936032770","name":"Timon","token":"6ef35a8e3c505466","acc":{"1":[{"v":5000,"t":1792936048819},{"v":10000,"t":1792936072269},{"v":1000,"t":1792936084169},{"v":-1000,"t":1792936091385},{"v":10000,"t":1792936100185},{"v":100000000000,"t":1792936112219},{"v":100000000000000000000,"t":1792936135735},{"v":5000000000,"t":1792936492035,"p":1}]}},{"id":"p1792936872367","name":"Daniel","token":"e9ca742616e92f6f","acc":{"1":[{"v":5000,"k":"w","t":1792936897317,"p":0},{"v":1,"k":"w","t":1792936913067,"p":2}],"2":[{"v":50000,"k":"w","t":1792936934717,"p":0}]}}]}</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
let acc=1,mode='w',admin=false,art=null,sel=null;
const N=5;
const tok=()=>location.hash.slice(1);
const me=()=>tok()?DATA.players.find(p=>p.token===tok()):null;
const fmt=(n,d=0)=>n.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const eff=e=>e.v*Math.pow(10,15*(e.p||0));
const fb=n=>Math.abs(n)<1e15?fmt(n):n.toExponential(2).replace('.',',').replace('e+','e');
const sg=n=>(n>0?'+':'')+fb(n);
const fp=n=>Math.abs(n)<1e5?fmt(n,2):n.toExponential(2).replace('.',',').replace('e+','e');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hist=(p,a)=>(p.acc[a]||[]).filter(e=>(e.k||'w')===mode);
const ML=()=>mode==='j'?'Jetons':'Wert';
const last=(p,a)=>{const h=hist(p,a);return h.length?eff(h[h.length-1]):null};
const lastP=(p,a)=>{const h=hist(p,a);return h.length?(h[h.length-1].p||0):0};

async function save(){
  if(!art)return alert('Speichern nicht verfügbar (nicht als Admin angemeldet).');
  try{
    const c=document.documentElement.cloneNode(true);
    c.querySelector('#app').innerHTML='';
    c.querySelector('#data').textContent=JSON.stringify(DATA).replace(/</g,'\\u003c');
    await art.publish('<!doctype html>\n'+c.outerHTML);
  }catch(e){alert('Speichern fehlgeschlagen: '+(e&&e.code||e&&e.message||e))}
}

function ranking(){
  const list=DATA.players.map(p=>({p,v:last(p,acc),pr:lastP(p,acc)})).filter(x=>x.v!==null).sort((a,b)=>b.v-a.v);
  const m=me();
  const rows=list.map((x,i)=>`<tr class="${m&&m.id===x.p.id?'me':''}"><td>${i+1}</td><td>${esc(x.p.name)}</td><td>${fb(x.v)}</td><td>${x.pr}</td></tr>`).join('');
  return `<div class="card"><h2>Rangliste ${ML()} – Account ${acc}</h2><div class="tw"><table><tr><th>#</th><th>Spieler</th><th>Aktuell: ${ML()}</th><th>Prestige</th></tr>${rows||'<tr><td colspan="4" class="mu">Noch keine Werte.</td></tr>'}</table></div></div>`;
}

function history(p){
  const h=hist(p,acc);
  const rows=h.map((e,i)=>{
    const prev=i?eff(h[i-1]):null;
    let d='–',pc='–',cl='';
    if(prev!==null){const x=eff(e)-prev;d=sg(x);cl=x>0?'up':x<0?'dn':'';pc=prev?((x>0?'+':'')+fp(x/prev*100)+' %'):'–'}
    return `<tr><td>${new Date(e.t).toLocaleDateString('de-DE')}</td><td>${fb(e.v)}</td><td>${e.p||0}</td><td>${fb(eff(e))}</td><td class="${cl}">${d}</td><td class="${cl}">${pc}</td></tr>`;
  }).reverse().join('');
  return `<div class="card"><h2>Verlauf ${ML()} ${esc(p.name)} – Account ${acc}</h2><div class="tw"><table><tr><th>Datum</th><th>Jetons</th><th>Prestige</th><th>Wert</th><th>Änderung</th><th>Änderung %</th></tr>${rows||'<tr><td colspan="6" class="mu">Noch keine Werte.</td></tr>'}</table></div></div>`;
}

function adminPanel(){
  const opts=DATA.players.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.name)}</option>`).join('');
  const accs=[1,2,3,4,5].map(i=>`<option value="${i}" ${i===acc?'selected':''}>Account ${i}</option>`).join('');
  const links=DATA.players.map(p=>`<div class="mu"><b>${esc(p.name)}</b>: Link-Endung <code>#${p.token}</code></div>`).join('');
  return `<div class="card"><h2>Admin</h2>
  <div class="row"><input id="np" placeholder="Neuer Spieler (Name)"><button class="pri" id="addp">Spieler anlegen</button></div>
  <div class="row"><select id="sp">${opts}</select><select id="sa">${accs}</select><input id="sv" type="number" step="any" placeholder="Jetons"><input id="spr" type="number" min="0" step="1" placeholder="Prestige (0)"><button class="pri" id="addv">Wert hinzufügen</button></div>
  <div class="row"><button id="delv">Letzten Wert löschen</button></div>
  <p class="mu">Spieler-Links: Artifact-Link + Endung. Mit dieser Adresse kann später ein QR-Code erzeugt werden.</p>${links}</div>`;
}

function render(){
  const m=me();
  const app=document.getElementById('app');
  const tabs=[1,2,3,4,5].map(i=>`<button class="${i===acc?'on':''}" data-a="${i}">Account ${i}</button>`).join('');
  let h=`<h1>🃏 Blackjack Accounts</h1><p class="sub">${m?'Hallo '+esc(m.name):'Öffentliche Rangliste'}</p><div class="tabs">${tabs}</div>`+ranking();
  if(m)h+=history(m);
  if(admin){
    const p=DATA.players.find(x=>x.id===sel)||DATA.players[0];
    if(p&&!m)h+=history(p);
    h+=adminPanel();
  }
  app.innerHTML=h;
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{acc=+b.dataset.a;render()});
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render()});
  if(admin){
    const sp=document.getElementById('sp');
    sp.onchange=()=>{sel=sp.value;render()};
    document.getElementById('sa').onchange=e=>{acc=+e.target.value;render()};
    document.getElementById('addp').onclick=async()=>{
      const n=document.getElementById('np').value.trim();if(!n)return;
      const a=new Uint8Array(8);crypto.getRandomValues(a);
      const token=[...a].map(x=>x.toString(16).padStart(2,'0')).join('');
      DATA.players.push({id:'p'+Date.now(),name:n,token,acc:{}});await save();
    };
    document.getElementById('addv').onclick=async()=>{
      const v=parseFloat(document.getElementById('sv').value);
      const p=DATA.players.find(x=>x.id===sp.value);if(!p||isNaN(v))return;
      (p.acc[acc]=p.acc[acc]||[]).push({v,k:mode,t:Date.now(),p:Math.max(0,parseInt(document.getElementById('spr').value)||0)});sel=p.id;await save();
    };
    document.getElementById('delv').onclick=async()=>{
      const p=DATA.players.find(x=>x.id===sp.value);
      if(p&&hist(p,acc).length&&confirm('Letzten Wert wirklich löschen?')){const L=p.acc[acc];for(let i=L.length-1;i>=0;i--)if((L[i].k||'w')===mode){L.splice(i,1);break;}await save();}
    };
  }
}
window.addEventListener('hashchange',render);
render();
(async()=>{
  try{
    const u=await claude.use('user');
    if(u&&u.canEdit()){admin=true;art=await claude.use('artifact');render();}
  }catch(e){}
})();
</script>
</body></html>
