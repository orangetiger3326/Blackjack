<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackjack Accounts</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1a1f1c;--mu:#6b746e;--ac:#0f7a4a;--up:#0f7a4a;--dn:#c0392b;--bd:#e1e5df}
@media(prefers-color-scheme:dark){:root{--bg:#101512;--card:#18201b;--tx:#e8ede9;--mu:#8e9a92;--ac:#3ecf8e;--up:#3ecf8e;--dn:#ff6b5b;--bd:#27322b}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--mu);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}.tabs button{flex:1;min-width:84px}
button,select,input{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{cursor:pointer}button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.link{border:0;background:none;color:var(--mu);text-decoration:underline;padding:4px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{color:var(--mu);font-weight:600;font-size:13px}
.up{color:var(--up)}.dn{color:var(--dn)}.me{background:rgba(15,122,74,.12);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.row>*{flex:1;min-width:110px}
.mu{color:var(--mu);font-size:13px}.err{color:var(--dn);margin:6px 0 0}code{word-break:break-all}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style></head><body><main id="app"></main>
<script>
let acc=1,pub=null,adm=null,isAdmin=false,sel=null,showLogin=false,err='';
const T=new URLSearchParams(location.search).get('t')||'';

const fmt=(n,d=0)=>n.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const sci=n=>n.toExponential(2).replace('.',',').replace('e+','e');
const eff=e=>e.v*Math.pow(10,15*(e.p||0));          // Wert = Jetons × 10^(15 · Prestige)
const fb=n=>Math.abs(n)<1e15?fmt(n):sci(n);
const fp=n=>Math.abs(n)<1e5?fmt(n,2):sci(n);
const sg=n=>(n>0?'+':'')+fb(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path,body){
  const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Fehler');
  return j;
}
async function load(){
  pub=await api('/api/public?t='+encodeURIComponent(T));
  if(isAdmin){try{adm=await api('/api/admin/data')}catch(e){isAdmin=false}}
  render();
}
async function act(path,body){
  try{err='';await api(path,body);await load()}catch(e){err=e.message;render()}
}

function ranking(){
  const list=(pub.rank[acc]||[]).map(x=>({...x,w:eff(x)})).sort((a,b)=>b.w-a.w);
  const rows=list.map((x,i)=>`<tr class="${x.mine?'me':''}"><td>${i+1}</td><td>${esc(x.name)}</td><td>${fb(x.w)}</td><td>${x.p}</td></tr>`).join('');
  return `<div class="card"><h2>Rangliste – Account ${acc}</h2><div class="tw"><table><tr><th>#</th><th>Spieler</th><th>Aktueller Wert</th><th>Prestige</th></tr>${rows||'<tr><td colspan="4" class="mu">Noch keine Werte.</td></tr>'}</table></div></div>`;
}

function history(name,h){
  const rows=h.map((e,i)=>{
    const prev=i?eff(h[i-1]):null;
    let d='–',pc='–',cl='';
    if(prev!==null){const x=eff(e)-prev;d=sg(x);cl=x>0?'up':x<0?'dn':'';pc=prev?((x>0?'+':'')+fp(x/prev*100)+' %'):'–'}
    return `<tr><td>${new Date(e.t).toLocaleDateString('de-DE')}</td><td>${fb(e.v)}</td><td>${e.p||0}</td><td>${fb(eff(e))}</td><td class="${cl}">${d}</td><td class="${cl}">${pc}</td></tr>`;
  }).reverse().join('');
  return `<div class="card"><h2>Verlauf ${esc(name)} – Account ${acc}</h2><div class="tw"><table><tr><th>Datum</th><th>Jetons</th><th>Prestige</th><th>Wert</th><th>Änderung</th><th>Änderung %</th></tr>${rows||'<tr><td colspan="6" class="mu">Noch keine Werte.</td></tr>'}</table></div></div>`;
}

function loginCard(){
  return `<div class="card"><h2>Admin-Login</h2>
  <form id="lf"><div class="row"><input id="lu" placeholder="Benutzername" autocomplete="username" required><input id="lp" type="password" placeholder="Passwort" autocomplete="current-password" required></div>
  <button class="pri" type="submit">Anmelden</button></form>${err?`<p class="err">${esc(err)}</p>`:''}</div>`;
}

function adminPanel(){
  const opts=adm.players.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.name)}</option>`).join('');
  const accs=[1,2,3,4,5].map(i=>`<option value="${i}" ${i===acc?'selected':''}>Account ${i}</option>`).join('');
  const base=location.origin+location.pathname;
  const links=adm.players.map(p=>`<div class="mu"><b>${esc(p.name)}</b>: <code>${esc(base)}?t=${p.token}</code></div>`).join('');
  return `<div class="card"><div class="top"><h2>Admin</h2><button class="link" id="lo">Abmelden</button></div>
  <div class="row"><input id="np" placeholder="Neuer Spieler (Name)"><button class="pri" id="addp">Spieler anlegen</button></div>
  <div class="row"><select id="sp">${opts}</select><select id="sa">${accs}</select><input id="sv" type="number" step="any" placeholder="Jetons"><input id="spr" type="number" min="0" max="20" step="1" placeholder="Prestige (0)"><button class="pri" id="addv">Eintragen</button></div>
  <div class="row"><button id="delv">Letzten Eintrag löschen</button><button id="delp">Spieler entfernen</button></div>
  ${err?`<p class="err">${esc(err)}</p>`:''}
  <p class="mu">Persönliche Links der Spieler (für QR-Codes):</p>${links}</div>`;
}

function render(){
  const app=document.getElementById('app');
  if(!pub){app.innerHTML='<p class="sub">Lädt …</p>';return}
  const m=pub.me;
  const tabs=[1,2,3,4,5].map(i=>`<button class="${i===acc?'on':''}" data-a="${i}">Account ${i}</button>`).join('');
  let h=`<h1>🃏 Blackjack Accounts</h1><p class="sub">${m?'Hallo '+esc(m.name):'Öffentliche Rangliste'}</p><div class="tabs">${tabs}</div>`+ranking();
  if(m)h+=history(m.name,m.acc[acc]||[]);
  if(isAdmin&&adm){
    if(!sel||!adm.players.find(p=>p.id===sel))sel=adm.players[0]&&adm.players[0].id;
    const p=adm.players.find(x=>x.id===sel);
    if(p&&!m)h+=history(p.name,p.acc[acc]||[]);
    h+=adminPanel();
  }else{
    h+=showLogin?loginCard():`<p style="text-align:center"><button class="link" id="sl">Admin-Login</button></p>`;
  }
  app.innerHTML=h;
  const $=id=>document.getElementById(id);
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{acc=+b.dataset.a;render()});
  if($('sl'))$('sl').onclick=()=>{showLogin=true;err='';render()};
  if($('lf'))$('lf').onsubmit=async e=>{
    e.preventDefault();
    try{await api('/api/login',{user:$('lu').value,pass:$('lp').value});isAdmin=true;showLogin=false;err='';await load()}
    catch(x){err=x.message;render()}
  };
  if(isAdmin&&adm){
    $('lo').onclick=async()=>{await api('/api/logout',{});isAdmin=false;adm=null;await load()};
    $('sp').onchange=e=>{sel=e.target.value;render()};
    $('sa').onchange=e=>{acc=+e.target.value;render()};
    $('addp').onclick=()=>{const n=$('np').value.trim();if(n)act('/api/admin/player',{name:n})};
    $('addv').onclick=()=>{
      const v=parseFloat($('sv').value);if(isNaN(v))return;
      sel=$('sp').value;
      act('/api/admin/value',{id:sel,acc,v,p:parseInt($('spr').value)||0});
    };
    $('delv').onclick=()=>{if(confirm('Letzten Eintrag wirklich löschen?'))act('/api/admin/delete-last',{id:$('sp').value,acc})};
    $('delp').onclick=()=>{if(confirm('Spieler samt allen Daten wirklich entfernen?'))act('/api/admin/remove-player',{id:$('sp').value})};
  }
}

(async()=>{
  try{isAdmin=(await api('/api/session')).admin}catch(e){}
  try{await load()}catch(e){document.getElementById('app').innerHTML='<p class="err">Server nicht erreichbar.</p>'}
})();
</script></body></html>
